<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Tromle 🥁 Spil</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { min-height:100%; }

    body {
      font-family:'Nunito', sans-serif;
      min-height:100dvh;
      background: linear-gradient(135deg, #1a1a4e 0%, #0d2b6b 40%, #1a3a5c 100%);
      display:flex; flex-direction:column;
      overflow-x:hidden;
    }

    /* Animated stars background */
    body::before {
      content:'';
      position:fixed; inset:0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,225,53,0.6) 1px, transparent 1px);
      background-size: 80px 80px, 120px 120px, 200px 200px;
      background-position: 0 0, 40px 40px, 80px 20px;
      animation: twinkle 4s ease-in-out infinite;
      pointer-events:none; z-index:0;
    }
    @keyframes twinkle {
      0%,100% { opacity:0.4 } 50% { opacity:0.9 }
    }

    /* NAV */
    nav {
      position:relative; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:0.7rem 1.2rem;
      background:rgba(0,0,0,0.3);
      backdrop-filter:blur(10px);
    }
    .nav-logo {
      font-family:'Boogaloo',cursive; font-size:1.4rem;
      color:#FFE135; text-decoration:none;
      display:flex; align-items:center; gap:0.4rem;
    }
    .back-btn {
      font-family:'Boogaloo',cursive; font-size:1rem;
      color:white; text-decoration:none;
      background:rgba(255,255,255,0.15);
      padding:0.35rem 1rem; border-radius:50px;
      border:1px solid rgba(255,255,255,0.2);
    }

    /* HEADER */
    .header {
      position:relative; z-index:10;
      text-align:center; padding:2rem 1rem 1rem;
    }
    .header-emoji {
      font-size:4rem;
      animation:bounce 1.5s ease-in-out infinite;
      display:block; margin-bottom:0.5rem;
    }
    @keyframes bounce {
      0%,100% { transform:translateY(0) }
      50% { transform:translateY(-12px) }
    }
    .header-title {
      font-family:'Boogaloo',cursive;
      font-size:clamp(2.2rem,8vw,3.5rem);
      color:#FFE135;
      text-shadow:0 4px 12px rgba(0,0,0,0.5);
      line-height:1.1;
    }
    .header-sub {
      font-size:clamp(1rem,4vw,1.3rem);
      color:rgba(255,255,255,0.8);
      margin-top:0.5rem;
    }

    /* GAME CARDS */
    .games-grid {
      position:relative; z-index:10;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:1.5rem;
      padding:1.5rem 1.2rem 2.5rem;
      max-width:720px; margin:0 auto; width:100%;
    }

    .game-card {
      background:rgba(255,255,255,0.08);
      border:3px solid rgba(255,255,255,0.15);
      border-radius:28px;
      overflow:hidden;
      text-decoration:none;
      display:flex; flex-direction:column;
      transition:transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      cursor:pointer;
    }
    .game-card:hover, .game-card:active {
      transform:translateY(-6px) scale(1.02);
      box-shadow:0 16px 48px rgba(0,0,0,0.5);
    }

    .card-solcreme { border-color:rgba(255,225,53,0.4); }
    .card-solcreme:hover { border-color:#FFE135; box-shadow:0 16px 48px rgba(255,225,53,0.25); }

    .card-kravle { border-color:rgba(78,205,196,0.4); }
    .card-kravle:hover { border-color:#4ECDC4; box-shadow:0 16px 48px rgba(78,205,196,0.25); }

    .card-img-wrap {
      position:relative; overflow:hidden;
      height:200px;
    }
    .card-img-wrap img {
      width:100%; height:100%;
      object-fit:cover;
      transition:transform 0.4s;
    }
    .game-card:hover .card-img-wrap img {
      transform:scale(1.06);
    }

    .card-badge {
      position:absolute; top:12px; right:12px;
      background:rgba(0,0,0,0.6);
      backdrop-filter:blur(6px);
      border-radius:50px; padding:0.2rem 0.7rem;
      font-family:'Boogaloo',cursive; font-size:0.9rem;
      color:white;
    }

    .card-body {
      padding:1.2rem 1.4rem 1.4rem;
      display:flex; flex-direction:column; gap:0.6rem;
      flex:1;
    }
    .card-emoji { font-size:2rem; }
    .card-title {
      font-family:'Boogaloo',cursive;
      font-size:1.8rem; color:white;
      text-shadow:0 2px 6px rgba(0,0,0,0.4);
      line-height:1.1;
    }
    .card-desc {
      font-size:0.95rem;
      color:rgba(255,255,255,0.75);
      line-height:1.5;
      flex:1;
    }

    .play-btn {
      display:flex; align-items:center; justify-content:center;
      gap:0.5rem;
      font-family:'Boogaloo',cursive; font-size:1.4rem;
      color:white;
      border:none; border-radius:50px;
      padding:0.7rem 1.5rem;
      margin-top:0.5rem;
      cursor:pointer; width:100%;
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .play-btn:active { transform:scale(0.96); }

    .btn-solcreme {
      background:linear-gradient(135deg,#FFE135,#ff8c00);
      box-shadow:0 4px 16px rgba(255,140,0,0.4);
    }
    .btn-kravle {
      background:linear-gradient(135deg,#4ECDC4,#1a8a83);
      box-shadow:0 4px 16px rgba(78,205,196,0.4);
    }

    /* FOOTER */
    .footer {
      position:relative; z-index:10;
      text-align:center; padding:1rem;
      color:rgba(255,255,255,0.35);
      font-size:0.85rem;
    }
  </style>
</head>
