<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DJ Tromle 🥁 Lære at gå spillet</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; touch-action:none; }

    body {
      font-family:'Nunito',sans-serif;
      min-height:100dvh;
      background:linear-gradient(180deg,#87CEEB 0%,#b0e8ff 50%,#5aaa32 50%,#3d8020 100%);
      display:flex; flex-direction:column;
    }

    /* Clouds */
    body::before {
      content:'☁️  ☁️      ☁️';
      position:fixed; top:8%; left:0; width:100%;
      font-size:2.5rem; letter-spacing:2rem;
      opacity:0.7; pointer-events:none; z-index:0;
      animation:cloudMove 20s linear infinite;
    }
    @keyframes cloudMove { from{transform:translateX(-10%)} to{transform:translateX(5%)} }

    /* NAV */
    nav {
      position:relative; z-index:20;
      display:flex; align-items:center; justify-content:space-between;
      padding:0.5rem 1rem;
      background:rgba(0,0,0,0.25); backdrop-filter:blur(10px);
      flex-shrink:0;
    }
    .nav-logo { font-family:'Boogaloo',cursive; font-size:1.3rem; color:#FFE135; text-decoration:none; }
    .back-btn {
      font-family:'Boogaloo',cursive; font-size:1rem; color:white;
      text-decoration:none; background:rgba(255,255,255,0.2);
      padding:0.3rem 0.9rem; border-radius:50px;
    }

    /* HUD */
    .hud {
      position:relative; z-index:20;
      display:flex; justify-content:space-between; align-items:center;
      padding:0.4rem 1rem; flex-shrink:0;
    }
    .hud-box {
      font-family:'Boogaloo',cursive; font-size:1.4rem; color:white;
      background:rgba(0,0,0,0.2); padding:0.2rem 0.8rem; border-radius:50px;
      min-width:80px; text-align:center;
      text-shadow:0 2px 4px rgba(0,0,0,0.4);
    }
    .hud-box.warn { color:#FF6B6B; animation:wobble 0.4s infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
    .hud-title { font-family:'Boogaloo',cursive; font-size:1.2rem; color:#FFE135; text-shadow:0 2px 4px rgba(0,0,0,0.4); }

    /* GAME AREA */
    #gameArea {
      flex:1; position:relative; overflow:hidden; z-index:10;
    }

    /* GROUND */
    .ground-deco {
      position:absolute; bottom:0; left:0; right:0; height:60px;
      display:flex; align-items:flex-end; justify-content:space-around;
      padding:0 1rem; pointer-events:none;
    }
    .flower { font-size:1.8rem; animation:sway 2s ease-in-out infinite; }
    .flower:nth-child(even) { animation-delay:0.5s; }
    @keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

    /* PATH / ROAD */
    .path {
      position:absolute; bottom:55px; left:0; right:0; height:18px;
      background:repeating-linear-gradient(90deg, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0.6) 30px, transparent 30px, transparent 60px);
      border-radius:9px;
    }

    /* CHILDREN (clapping) */
    .child {
      position:absolute; bottom:70px;
      transition:transform 0.15s;
    }
    .child img { display:block; height:clamp(100px,22vw,150px); width:auto; filter:drop-shadow(2px 4px 8px rgba(0,0,0,0.3)); }
    .child-left  { left:2%; }
    .child-right { right:2%; transform:scaleX(-1); }

    .child.clap { animation:clap 0.25s ease; }
    @keyframes clap {
      0%  { transform:scale(1); }
      40% { transform:scale(1.15) rotate(-5deg); }
      100%{ transform:scale(1); }
    }
    .child-right.clap { animation:clapR 0.25s ease; }
    @keyframes clapR {
      0%  { transform:scaleX(-1) scale(1); }
      40% { transform:scaleX(-1) scale(1.15) rotate(5deg); }
      100%{ transform:scaleX(-1) scale(1); }
    }

    /* CLAP BUBBLES */
    .clap-bubble {
      position:absolute; pointer-events:none;
      font-family:'Boogaloo',cursive; font-size:1.4rem;
      color:#FFE135; text-shadow:0 2px 6px rgba(0,0,0,0.5);
      animation:bubbleUp 0.9s ease forwards;
    }
    @keyframes bubbleUp { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-70px);opacity:0} }

    /* DJ TROMLE */
    #tromle {
      position:absolute; bottom:55px;
      left:calc(50% - 80px);
      z-index:30;
      transition:left 0.12s ease-out;
    }
    #tromle img {
      display:block;
      height:clamp(110px,25vw,170px);
      width:auto;
      filter:drop-shadow(3px 6px 10px rgba(0,0,0,0.4));
      transition:transform 0.1s;
    }
    #tromle.stepL img { transform:rotate(-8deg) translateY(-6px); }
    #tromle.stepR img { transform:rotate(8deg)  translateY(-6px); }
    #tromle.fall   img { transform:rotate(90deg) translateY(20px); filter:drop-shadow(3px 6px 10px rgba(0,0,0,0.4)); }

    /* STEP BUTTONS */
    .step-buttons {
      display:flex; padding:0.5rem; gap:0.5rem;
      z-index:30; background:rgba(0,0,0,0.2);
      flex-shrink:0;
    }
    .step-btn {
      flex:1; height:clamp(60px,15vw,85px);
      border:none; border-radius:20px;
      font-family:'Boogaloo',cursive; font-size:clamp(1.5rem,6vw,2.2rem);
      color:white; cursor:pointer;
      box-shadow:0 6px 0 rgba(0,0,0,0.25);
      transition:transform 0.08s, box-shadow 0.08s;
      touch-action:manipulation;
    }
    .step-btn:active {
      transform:translateY(4px);
      box-shadow:0 2px 0 rgba(0,0,0,0.25);
    }
    .btn-left  { background:linear-gradient(135deg,#FF6B6B,#c4001d); }
    .btn-right { background:linear-gradient(135deg,#4ECDC4,#0f7a73); }

    /* RHYTHM INDICATOR */
    .rhythm-wrap {
      position:absolute; top:8px; left:50%; transform:translateX(-50%);
      display:flex; gap:6px; align-items:center; z-index:25;
    }
    .beat-dot {
      width:14px; height:14px; border-radius:50%;
      background:rgba(255,255,255,0.3);
      transition:background 0.1s, transform 0.1s;
    }
    .beat-dot.active {
      background:#FFE135;
      transform:scale(1.4);
      box-shadow:0 0 10px rgba(255,225,53,0.8);
    }

    /* PROGRESS BAR */
    .progress-wrap {
      position:absolute; top:6px; left:10%; right:10%; height:8px;
      background:rgba(255,255,255,0.2); border-radius:50px; z-index:25;
    }
    .progress-bar {
      height:100%; border-radius:50px;
      background:linear-gradient(90deg,#FFE135,#ff8c00);
      transition:width 0.2s;
      box-shadow:0 0 8px rgba(255,140,0,0.6);
    }

    /* COMBO */
    .combo-popup {
      position:absolute; top:18%; left:50%; transform:translateX(-50%);
      font-family:'Boogaloo',cursive; font-size:2.5rem;
      color:#FFE135; text-shadow:0 0 20px rgba(255,225,53,0.8);
      pointer-events:none; z-index:50;
      animation:comboPop 0.7s ease forwards;
    }
    @keyframes comboPop {
      0%  {transform:translateX(-50%) scale(0.5); opacity:0}
      40% {transform:translateX(-50%) scale(1.3); opacity:1}
      100%{transform:translateX(-50%) scale(1) translateY(-30px); opacity:0}
    }

    /* START SCREEN */
    .start-screen {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      z-index:200; gap:0.8rem; padding:1.5rem;
    }
    .start-img { height:160px; width:auto; animation:bounce 1.2s ease-in-out infinite; filter:drop-shadow(3px 6px 10px rgba(0,0,0,0.5)); }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    .start-title {
      font-family:'Boogaloo',cursive;
      font-size:clamp(2rem,9vw,3rem);
      color:#FFE135; text-shadow:0 4px 12px rgba(0,0,0,0.5);
      text-align:center;
    }
    .start-sub { color:rgba(255,255,255,0.88); font-size:clamp(0.95rem,3.5vw,1.2rem); text-align:center; max-width:300px; line-height:1.5; }
    .btn-row { display:flex; gap:1rem; }
    .demo-btn {
      font-size:2.5rem; padding:0.4rem 1.2rem; border-radius:16px; border:none;
      cursor:default;
    }
    .demo-left  { background:linear-gradient(135deg,#FF6B6B,#c4001d); }
    .demo-right { background:linear-gradient(135deg,#4ECDC4,#0f7a73); }
    .start-btn {
      font-family:'Boogaloo',cursive; font-size:1.8rem;
      background:linear-gradient(135deg,#FFE135,#ff8c00);
      border:none; border-radius:50px;
      padding:0.7rem 2.5rem; color:white; cursor:pointer;
      box-shadow:0 4px 18px rgba(255,140,0,0.5);
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

    /* DONE OVERLAY */
    .done-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.88); backdrop-filter:blur(8px);
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      z-index:200; padding:1rem; gap:0.7rem;
    }
    .done-overlay.show { display:flex; }
    .done-title { font-family:'Boogaloo',cursive; font-size:clamp(2rem,8vw,2.8rem); color:#FFE135; }
    .done-score { font-family:'Boogaloo',cursive; font-size:clamp(3.5rem,14vw,5rem); color:white; line-height:1; }
    .done-label { color:rgba(255,255,255,0.6); font-size:0.95rem; margin-top:-0.3rem; }
    #nameInput {
      font-family:'Boogaloo',cursive; font-size:1.3rem;
      border:2px solid rgba(255,255,255,0.3); border-radius:50px;
      padding:0.6rem 1.2rem; text-align:center;
      width:min(300px,90vw); background:rgba(255,255,255,0.1); color:white; outline:none;
    }
    #nameInput::placeholder { color:rgba(255,255,255,0.4); }
    .btn-gem {
      font-family:'Boogaloo',cursive; font-size:1.4rem;
      background:linear-gradient(135deg,#FFE135,#ff8c00);
      border:none; border-radius:50px; padding:0.6rem 2rem;
      color:white; cursor:pointer; width:min(300px,90vw);
      box-shadow:0 4px 15px rgba(255,140,0,0.4);
    }
    .btn-again {
      font-family:'Boogaloo',cursive; font-size:1.2rem;
      background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.25);
      border-radius:50px; padding:0.5rem 1.5rem;
      color:white; cursor:pointer; width:min(300px,90vw);
    }
    .leaderboard { width:min(300px,90vw); background:rgba(255,255,255,0.07); border-radius:16px; padding:0.7rem 1rem; }
    .lb-title { font-family:'Boogaloo',cursive; font-size:1.1rem; color:#FFE135; text-align:center; margin-bottom:0.4rem; }
    .lb-row { display:flex; align-items:center; gap:0.5rem; padding:0.25rem 0.3rem; border-radius:8px; color:white; font-size:0.95rem; }
    .lb-row:nth-child(2) { background:rgba(255,215,0,0.18); }
    .lb-medal { font-size:1.1rem; min-width:1.8rem; text-align:center; }
    .lb-name { flex:1; font-weight:700; }
    .lb-pts { font-family:'Boogaloo',cursive; font-size:1.1rem; color:#FFE135; }
    .confetti { position:fixed; pointer-events:none; z-index:999; border-radius:2px; animation:fall linear forwards; }
    @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(105vh) rotate(720deg);opacity:0} }
  </style>
</head>

  <div class="start-title">Lære at gå spillet!</div>
  <div class="start-sub">Tryk skiftevis på <b>Venstre</b> og <b>Højre</b> i takt — så klappper børnene! 👏</div>
  <div class="btn-row">
    <div class="demo-btn demo-left">👣</div>
    <div class="demo-btn demo-right">👣</div>
  </div>
  <button class="start-btn" onclick="startGame()">🚀 Start!</button>
</div>

<!-- Done overlay -->
<div class="done-overlay" id="doneOverlay">
  <div class="done-title">🎉 Godt gået!</div>
  <div class="done-score" id="finalScore">0</div>
  <div class="done-label">skridt i takt!</div>
  <input id="nameInput" type="text" placeholder="Skriv dit navn..." maxlength="15">
  <button class="btn-gem" id="gemBtn" onclick="saveName()">💾 Gem score!</button>
  <div class="leaderboard" id="leaderboard"><div class="lb-title">🏆 Topplisten</div></div>
  <button class="btn-again" onclick="resetGame()">🔄 Spil igen</button>
</div>

<script>
  var FIREBASE = 'https://dj-tromle-default-rtdb.europe-west1.firebasedatabase.app/gaaspil_hiscores.json';

  var score = 0, timeLeft = 30, running = false;
  var lastStep = null;   // 'L' or 'R'
  var combo = 0, totalSteps = 0;
  var tromleX = 50;     // % position
  var timerInt = null;
  var beatCount = 0;
  var lastStepTime = 0;
  var BEAT_WINDOW = 900; // ms — how long you have to alternate

  // Audio
  var actx = null;
  function initAudio(){ if(!actx) try{ actx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  function playStep(good){
    if(!actx) return;
    try{
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type='sine';
      o.frequency.value = good ? 440+combo*30 : 200;
      g.gain.setValueAtTime(0.35,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+0.18);
      o.start(actx.currentTime); o.stop(actx.currentTime+0.18);
    }catch(e){}
  }
  function playClapSound(){
    if(!actx) return;
    try{
      var buf=actx.createBuffer(1,actx.sampleRate*0.1,actx.sampleRate);
      var data=buf.getChannelData(0);
      for(var i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*0.04));
      var src=actx.createBufferSource(), g=actx.createGain();
      src.buffer=buf; src.connect(g); g.connect(actx.destination);
      g.gain.value=0.5; src.start();
    }catch(e){}
  }

  // Hiscores
  async function getScores(){
    try{ var r=await fetch(FIREBASE), d=await r.json(); if(Array.isArray(d)&&d.length){ localStorage.setItem('gaa_hs',JSON.stringify(d)); return d; } }catch(e){}
    try{ return JSON.parse(localStorage.getItem('gaa_hs')||'[]'); }catch(e){ return []; }
  }
  async function addScore(name,sc){
    var list=await getScores();
    list.push({name,score:sc}); list.sort((a,b)=>b.score-a.score); list=list.slice(0,5);
    localStorage.setItem('gaa_hs',JSON.stringify(list));
    try{ await fetch(FIREBASE,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(list)}); }catch(e){}
    return list;
  }
  async function renderLB(override){
    var list=override||await getScores();
    var el=document.getElementById('leaderboard');
    var medals=['🥇','🥈','🥉','4️⃣','5️⃣'];
    if(!list.length){ el.innerHTML='<div class="lb-title">🏆 Topplisten</div><div style="color:rgba(255,255,255,0.4);text-align:center;padding:0.4rem">Ingen scores endnu</div>'; return; }
    el.innerHTML='<div class="lb-title">🏆 Topplisten</div>'+list.map(function(e,i){ return '<div class="lb-row"><span class="lb-medal">'+medals[i]+'</span><span class="lb-name">'+e.name+'</span><span class="lb-pts">'+e.score+'</span></div>'; }).join('');
  }

  // Step logic
  function step(side){
    if(!running) return;
    initAudio();
    var now = Date.now();
    var tromle = document.getElementById('tromle');
    var good = false;

    if(lastStep === null){
      // First step — always good
      good = true;
    } else if(lastStep === side){
      // Same foot — mistake!
      good = false;
    } else if(now - lastStepTime < BEAT_WINDOW){
      // Correct foot, in time
      good = true;
    } else {
      // Correct foot but too slow
      good = true; combo = 0;
    }

    if(good && lastStep !== side){
      combo++;
      score += combo > 3 ? 3 : 1;
      totalSteps++;
      document.getElementById('scoreDisp').textContent = score;
      playStep(true);

      // Move tromle
      var dir = side === 'R' ? 1 : -1;
      tromleX = Math.max(20, Math.min(80, tromleX + dir * 3));
      tromle.style.left = 'calc(' + tromleX + '% - 80px)';
      tromle.classList.remove('stepL','stepR','fall');
      tromle.classList.add(side === 'L' ? 'stepL' : 'stepR');
      setTimeout(()=> tromle.classList.remove('stepL','stepR'), 180);

      // Clap!
      doClap();
      if(combo >= 5) showCombo(combo);

      // Score float
      var pop = document.createElement('div');
      pop.className = 'clap-bubble';
      pop.textContent = combo > 3 ? '👏 +' + (combo>3?3:1) + ' 🔥' : '👏';
      pop.style.left = (30+Math.random()*40)+'vw';
      pop.style.top  = (35+Math.random()*20)+'vh';
      document.getElementById('gameArea').appendChild(pop);
      setTimeout(()=>pop.remove(), 900);

    } else if(lastStep === side) {
      // Same foot — wobble
      playStep(false);
      tromle.classList.add('fall');
      setTimeout(()=> tromle.classList.remove('fall'), 400);
      combo = 0;
    }

    lastStep = side;
    lastStepTime = now;

    // Progress bar
    var pct = Math.min(100, (totalSteps/60)*100);
    document.getElementById('progressBar').style.width = pct+'%';
  }

  function doClap(){
    playClapSound();
    var l = document.getElementById('childLeft');
    var r = document.getElementById('childRight');
    l.classList.remove('clap'); r.classList.remove('clap');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      l.classList.add('clap'); r.classList.add('clap');
      setTimeout(()=>{ l.classList.remove('clap'); r.classList.remove('clap'); },300);
    }));
  }

  function showCombo(n){
    var el = document.createElement('div');
    el.className = 'combo-popup';
    el.textContent = n >= 10 ? '🔥 SUPER ×'+n+'!' : '👏 COMBO ×'+n+'!';
    document.getElementById('gameArea').appendChild(el);
    setTimeout(()=>el.remove(), 750);
  }

  // Game flow
  function startGame(){
    initAudio();
    document.getElementById('startScreen').style.display='none';
    score=0; timeLeft=30; running=true; lastStep=null; combo=0; totalSteps=0; tromleX=50;
    document.getElementById('scoreDisp').textContent='0';
    document.getElementById('timer').textContent='30';
    document.getElementById('timerBox').classList.remove('warn');
    document.getElementById('tromle').style.left='calc(50% - 80px)';
    document.getElementById('progressBar').style.width='0%';

    timerInt=setInterval(()=>{
      timeLeft--;
      document.getElementById('timer').textContent=timeLeft;
      if(timeLeft<=10) document.getElementById('timerBox').classList.add('warn');
      if(timeLeft<=0) endGame();
    },1000);
  }

  async function endGame(){
    running=false; clearInterval(timerInt);
    document.getElementById('finalScore').textContent=score;
    await renderLB();
    document.getElementById('doneOverlay').classList.add('show');
    confetti();
    setTimeout(()=>{ var inp=document.getElementById('nameInput'); if(inp)inp.focus(); },400);
  }

  async function saveName(){
    var name=document.getElementById('nameInput').value.trim()||'Anonym';
    var list=await addScore(name,score);
    renderLB(list);
    document.getElementById('gemBtn').textContent='✅ Gemt!';
    document.getElementById('gemBtn').disabled=true;
    document.getElementById('nameInput').disabled=true;
  }

  function resetGame(){
    document.getElementById('doneOverlay').classList.remove('show');
    document.getElementById('nameInput').disabled=false;
    document.getElementById('nameInput').value='';
    document.getElementById('gemBtn').textContent='💾 Gem score!';
    document.getElementById('gemBtn').disabled=false;
    document.getElementById('startScreen').style.display='flex';
  }

    function confetti(){
    var cols=['#FFE135','#FF6B6B','#4ECDC4','#A8E6CF','#FF8C42','white'];
    for(var i=0;i<70;i++){
      (function(n){ setTimeout(function(){
        var p=document.createElement('div'); p.className='confetti';
        p.style.left=Math.random()*100+'vw';
        p.style.width=(6+Math.random()*8)+'px';
        p.style.height=(6+Math.random()*8)+'px';
        p.style.background=cols[Math.floor(Math.random()*cols.length)];
        p.style.animationDuration=(1.5+Math.random()*2)+'s';
        document.body.appendChild(p);
        setTimeout(function(){ p.remove(); },3500);
      }, n*25); })(i);
    }
  }

  // Keyboard support
  document.addEventListener('keydown', function(e){
    if(!running) return;
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') step('L');
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') step('R');
  });

  renderLB();
</script>
</body>
</html>
